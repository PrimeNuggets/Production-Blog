media:
  name: images
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts

    fields:
      - name: title
        label: Title
        type: string
      
      - name: author
        label: Author
        type: string
      
      - name: date
        label: Date
        type: date

      - name: body
        label: Post
        type: rich-text
        options:
          media: images