<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="referrer" content="no-referrer">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lizard Wizard - Production Blog</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <header>
            <button id="optionsButton">
                Options
            </button>
            <h1>
                Production Blog
            </h1>
        </header>
        <!--nav>
            <a href="#teamBios">Jump To: The Team</a>
            <a href="#logs">Jump To: Dev Logs</a>
        </nav-->
        <br>
        <div class="section">
            <h2 style="text-align: center;">
                Developers
            </h2>
            <div id="teamBios" class="gridDisplay">
                <div>
                    <h3>Diego</h3>
                    <p></p>
                </div>
                <div>
                    <h3>Georgi</h3>
                    <p></p>
                </div>
                <div>
                    <h3>Ibrahim</h3>
                    <p></p>
                </div>
                <div>
                    <h3>Vivian</h3>
                    <p></p>
                </div>
                <div>
                    <h3>Xavier</h3>
                    <p>
                        A systems designer
                    </p>
                </div>
            </div>
        </div>
        <br>
        <div class="section">
            <h2 id="logs">
                Dev Logs
            </h2>
            <div class="posts">
                {% for post in site.posts %}
                    <article class="post">
                        <h3>{{ post.title | escape }}</h3>
                        <p>
                            By {{ post.author | escape }}
                            {{ post.date | date: "%B %-d, %Y"}}
                        </p>
                    </article>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
